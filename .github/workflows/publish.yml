name: publish
run-name: "publish ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
      - 'v*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Markdown release notes"
        required: false
        type: string
      publish_test:
        description: "Publish this branch to npm with the beta dist-tag"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install cross-platform native dependencies
        run: bun install --frozen-lockfile --os="*" --cpu="*"
      - name: Type check
        run: bunx tsc --noEmit
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $VERSION" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build binaries and release archives
        run: bun publish/scripts/build.ts
        env:
          RELEASE: "true"
      - name: Upload binaries and archives
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
      - name: Validate npm packages without publishing
        run: bun run publish/scripts/publish.ts
        env:
          PUBLISH_DRY_RUN: "true"

  publish-binaries:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_test)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish binary packages
        run: |
          bun run publish/scripts/publish.ts
        env:
          PUBLISH_BINARIES: "true"
          PUBLISH_MAIN: "false"
          PUBLISH_CHANNEL: ${{ inputs.publish_test && 'beta' || '' }}

  publish-main:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_test)
    needs: publish-binaries
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish orey-ai
        run: |
          bun run publish/scripts/publish.ts
        env:
          PUBLISH_BINARIES: "false"
          PUBLISH_MAIN: "true"
          PUBLISH_CHANNEL: ${{ inputs.publish_test && 'beta' || '' }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Read package version
        id: package
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        run: |
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          else
            printf 'Release v%s\n' '${{ steps.package.outputs.version }}' > release-notes.md
          fi
          gh release create v${{ steps.package.outputs.version }} \
            --title "v${{ steps.package.outputs.version }}" \
            --notes-file release-notes.md \
            dist/binaries/*.tar.gz \
            dist/binaries/*.zip \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
